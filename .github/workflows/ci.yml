name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run security:scan
      - run: npm run security:audit
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e:list
      - run: npm run release:check

  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MYSQL_TEST_HOST: 127.0.0.1
      MYSQL_TEST_PORT: 3306
      MYSQL_TEST_USER: root
      MYSQL_TEST_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:mysql

  e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: crm_phase6_e2e
      CRM_ADMIN_EMAIL: admin.phase6@example.test
      CRM_ADMIN_PASSWORD: Phase6-Aa!Local-Test-Only
      CRM_ADMIN_NAME: Administrador E2E
      SESSION_COOKIE_SECURE: 0
      BACKUP_REQUIRE_EXTERNAL_STORAGE: 0
      BACKUP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      JOB_ARTIFACT_DIR: /tmp/bobcrm-e2e/jobs
      BACKUP_EXTERNAL_DIR: /tmp/bobcrm-e2e/backups
      E2E_BASE_URL: http://127.0.0.1:3106
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: mysql -h127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS crm_phase6_e2e CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
      - run: mkdir -p /tmp/bobcrm-e2e/jobs /tmp/bobcrm-e2e/backups
      - run: npm run build
      - run: node server/index.js > /tmp/bobcrm-e2e-server.log 2>&1 &
      - run: |
          for i in $(seq 1 120); do
            curl -fsS http://127.0.0.1:3106/health/ready && break
            sleep 1
          done
      - run: npm run test:e2e

  load-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MYSQL_TEST_HOST: 127.0.0.1
      MYSQL_TEST_PORT: 3306
      MYSQL_TEST_USER: root
      MYSQL_TEST_PASSWORD: root
      RUN_LOAD_TEST: 1
      LOAD_TEST_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:load
